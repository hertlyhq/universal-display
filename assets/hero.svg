<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="A MacBook extending its desktop onto an Android tablet, with a phone controlling the Mac">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151A3D"/>
      <stop offset="1" stop-color="#080A1A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5B67F5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5B67F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9B6BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9B6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A95FF"/>
      <stop offset="0.45" stop-color="#4B5BF0"/>
      <stop offset="1" stop-color="#1B226E"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB86B"/>
      <stop offset="0.5" stop-color="#FF6B9A"/>
      <stop offset="1" stop-color="#7A5CFF"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3050"/>
      <stop offset="1" stop-color="#0B0D18"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9C0D8"/>
      <stop offset="1" stop-color="#5D6584"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="macScreen"><rect x="283" y="99" width="534" height="330" rx="10"/></clipPath>
    <clipPath id="tabScreen"><rect x="882" y="152" width="266" height="176" rx="12"/></clipPath>
    <clipPath id="phoneScreen"><rect x="129" y="419" width="232" height="106" rx="19"/></clipPath>
    <!-- Wallpaper waves, reused on every screen. -->
    <g id="waves">
      <path d="M-40 260 C 120 180, 260 320, 420 240 S 700 160, 900 250" stroke="url(#wave)" stroke-width="40" fill="none"/>
      <path d="M-40 330 C 140 260, 300 380, 480 300 S 760 230, 940 320" stroke="url(#wave)" stroke-width="24" fill="none"/>
    </g>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="600" rx="32" fill="url(#bg)"/>
  <circle cx="560" cy="270" r="330" fill="url(#glowA)"/>
  <circle cx="1010" cy="220" r="220" fill="url(#glowB)"/>
  <path opacity="0.06" stroke="#FFFFFF" d="M0 120 H1200 M0 240 H1200 M0 360 H1200 M0 480 H1200 M150 0 V600 M300 0 V600 M450 0 V600 M600 0 V600 M750 0 V600 M900 0 V600 M1050 0 V600"/>

  <!-- Shadows -->
  <ellipse cx="550" cy="470" rx="350" ry="16" fill="#000" opacity="0.45" filter="url(#blur)"/>
  <ellipse cx="1015" cy="352" rx="150" ry="10" fill="#000" opacity="0.5" filter="url(#blur)"/>

  <!-- MacBook -->
  <rect x="270" y="86" width="560" height="356" rx="22" fill="url(#bezel)" stroke="#3A4266" stroke-width="2"/>
  <g clip-path="url(#macScreen)">
    <rect x="283" y="99" width="534" height="330" fill="url(#wall)"/>
    <use href="#waves" transform="translate(283 40)"/>
    <!-- menu bar -->
    <rect x="283" y="99" width="534" height="16" fill="#000" opacity="0.22"/>
    <rect x="296" y="104" width="8" height="6" rx="2" fill="#FFF" opacity="0.85"/>
    <rect x="312" y="104" width="26" height="6" rx="3" fill="#FFF" opacity="0.7"/>
    <rect x="344" y="104" width="20" height="6" rx="3" fill="#FFF" opacity="0.5"/>
    <rect x="370" y="104" width="22" height="6" rx="3" fill="#FFF" opacity="0.5"/>
    <!-- status items, Universal Display highlighted -->
    <rect x="712" y="102" width="20" height="10" rx="5" fill="#5B67F5"/>
    <rect x="717" y="105" width="10" height="5" rx="1.5" fill="none" stroke="#FFF" stroke-width="1.2"/>
    <rect x="740" y="104" width="12" height="6" rx="3" fill="#FFF" opacity="0.6"/>
    <rect x="760" y="104" width="14" height="6" rx="3" fill="#FFF" opacity="0.6"/>
    <rect x="782" y="104" width="26" height="6" rx="3" fill="#FFF" opacity="0.8"/>

    <!-- notes window -->
    <rect x="310" y="138" width="250" height="176" rx="10" fill="#FFFFFF" opacity="0.96" filter="url(#shadow)"/>
    <path d="M320 138 H388 V314 H320 A10 10 0 0 1 310 304 V148 A10 10 0 0 1 320 138 Z" fill="#EEF0F8"/>
    <circle cx="324" cy="151" r="4" fill="#FF5F57"/><circle cx="337" cy="151" r="4" fill="#FEBC2E"/><circle cx="350" cy="151" r="4" fill="#28C840"/>
    <rect x="320" y="172" width="56" height="9" rx="4" fill="#5B67F5" opacity="0.85"/>
    <rect x="320" y="190" width="48" height="7" rx="3.5" fill="#C8CDE0"/>
    <rect x="320" y="204" width="52" height="7" rx="3.5" fill="#C8CDE0"/>
    <rect x="320" y="218" width="40" height="7" rx="3.5" fill="#C8CDE0"/>
    <rect x="402" y="164" width="120" height="11" rx="5" fill="#1F2440"/>
    <rect x="402" y="186" width="140" height="7" rx="3.5" fill="#D5D9E8"/>
    <rect x="402" y="200" width="128" height="7" rx="3.5" fill="#D5D9E8"/>
    <rect x="402" y="214" width="136" height="7" rx="3.5" fill="#D5D9E8"/>
    <rect x="402" y="228" width="96" height="7" rx="3.5" fill="#D5D9E8"/>
    <rect x="402" y="250" width="140" height="44" rx="6" fill="#EEF0FF"/>

    <!-- photo window: its left part on the Mac… -->
    <rect x="640" y="196" width="260" height="150" rx="10" fill="#FFFFFF" filter="url(#shadow)"/>
    <circle cx="654" cy="209" r="4" fill="#FF5F57"/><circle cx="667" cy="209" r="4" fill="#FEBC2E"/><circle cx="680" cy="209" r="4" fill="#28C840"/>
    <rect x="650" y="222" width="240" height="114" rx="6" fill="url(#photo)"/>
    <circle cx="700" cy="262" r="16" fill="#FFF3C4" opacity="0.9"/>
    <path d="M650 336 L705 286 L740 312 L790 266 L890 336 Z" fill="#3B2A7A" opacity="0.55"/>

    <!-- dock -->
    <rect x="430" y="398" width="240" height="26" rx="9" fill="#FFFFFF" opacity="0.2"/>
    <rect x="440" y="402" width="18" height="18" rx="5" fill="#4FA8FF"/>
    <rect x="465" y="402" width="18" height="18" rx="5" fill="#34C759"/>
    <rect x="490" y="402" width="18" height="18" rx="5" fill="#FF9F0A"/>
    <rect x="515" y="402" width="18" height="18" rx="5" fill="#FF375F"/>
    <rect x="540" y="402" width="18" height="18" rx="5" fill="#FFFFFF"/>
    <rect x="565" y="402" width="18" height="18" rx="5" fill="#BF5AF2"/>
    <rect x="590" y="402" width="18" height="18" rx="5" fill="#5B67F5"/>
    <rect x="615" y="402" width="18" height="18" rx="5" fill="#8E8E93"/>
    <rect x="642" y="402" width="18" height="18" rx="5" fill="#64D2FF"/>
  </g>
  <rect x="270" y="86" width="560" height="356" rx="22" fill="url(#sheen)"/>
  <rect x="514" y="99" width="72" height="12" rx="6" fill="#0B0D18"/>
  <path d="M220 442 H880 V452 Q880 462 866 462 H234 Q220 462 220 452 Z" fill="url(#base)"/>
  <path d="M500 442 H600 Q596 449 586 449 H514 Q504 449 500 442 Z" fill="#4A5170"/>

  <!-- Tablet: the same desktop, extended -->
  <rect x="870" y="140" width="290" height="200" rx="22" fill="url(#bezel)" stroke="#3A4266" stroke-width="2"/>
  <g clip-path="url(#tabScreen)">
    <rect x="882" y="152" width="266" height="176" fill="url(#wall)"/>
    <use href="#waves" transform="translate(600 20)"/>
    <rect x="882" y="152" width="266" height="13" fill="#000" opacity="0.2"/>
    <rect x="1036" y="180" width="96" height="62" rx="9" fill="#FFFFFF" opacity="0.9"/>
    <rect x="1046" y="192" width="40" height="7" rx="3.5" fill="#5B67F5"/>
    <rect x="1046" y="206" width="70" height="6" rx="3" fill="#D5D9E8"/>
    <rect x="1046" y="218" width="58" height="6" rx="3" fill="#D5D9E8"/>
    <rect x="1036" y="252" width="96" height="62" rx="9" fill="#FFFFFF" opacity="0.25"/>
    <!-- …and the rest of it on the tablet -->
    <rect x="705" y="196" width="260" height="150" rx="10" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="715" y="222" width="240" height="114" rx="6" fill="url(#photo)"/>
    <path d="M715 336 L770 286 L805 312 L855 266 L955 336 Z" fill="#3B2A7A" opacity="0.55"/>
    <!-- pointer dragging the window -->
    <path d="M930 206 L930 228 L935.5 222.5 L939.5 231.5 L943 230 L939 221 L946.5 221 Z" fill="#111" stroke="#FFF" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <rect x="870" y="140" width="290" height="200" rx="22" fill="url(#sheen)"/>

  <!-- Phone: remote control of the same Mac -->
  <rect x="120" y="410" width="250" height="124" rx="26" fill="url(#bezel)" stroke="#3A4266" stroke-width="2" filter="url(#shadow)"/>
  <g clip-path="url(#phoneScreen)">
    <rect x="129" y="419" width="232" height="106" fill="url(#wall)"/>
    <rect x="129" y="419" width="232" height="7" fill="#000" opacity="0.22"/>
    <rect x="142" y="434" width="104" height="72" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <path d="M148 434 H174 V506 H148 A6 6 0 0 1 142 500 V440 A6 6 0 0 1 148 434 Z" fill="#EEF0F8"/>
    <rect x="182" y="444" width="52" height="5" rx="2.5" fill="#1F2440"/>
    <rect x="182" y="455" width="56" height="4" rx="2" fill="#D5D9E8"/>
    <rect x="182" y="464" width="50" height="4" rx="2" fill="#D5D9E8"/>
    <rect x="276" y="452" width="80" height="58" rx="5" fill="#FFFFFF"/>
    <rect x="280" y="460" width="72" height="46" rx="3" fill="url(#photo)"/>
    <rect x="200" y="512" width="90" height="10" rx="4" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="300" cy="476" r="13" fill="#FFFFFF" opacity="0.25"/>
    <circle cx="300" cy="476" r="6" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <rect x="120" y="410" width="250" height="124" rx="26" fill="url(#sheen)"/>

  <!-- Captions -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" fill="#FFFFFF" text-anchor="middle">
    <text x="600" y="508" font-size="17" font-weight="600">Your Mac</text>
    <text x="1015" y="378" font-size="17" font-weight="600">Tablet as a second display</text>
    <text x="1015" y="400" font-size="13" fill-opacity="0.6">USB · cable · Wi‑Fi</text>
    <text x="245" y="562" font-size="17" font-weight="600">Phone as a remote</text>
    <text x="245" y="584" font-size="13" fill-opacity="0.6">at home or over Tailscale</text>
  </g>
</svg>
