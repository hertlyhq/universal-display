<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="A Mac extending its desktop onto an Android tablet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2448"/>
      <stop offset="1" stop-color="#0C0F1F"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A86FF"/>
      <stop offset="0.55" stop-color="#4B5BF0"/>
      <stop offset="1" stop-color="#2A3BC8"/>
    </linearGradient>
    <linearGradient id="screen2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E7BFF"/>
      <stop offset="1" stop-color="#2A4BE8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9B2FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A9B2FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A9B2FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="600" cy="250" r="170" fill="#5B67F5" opacity="0.22" filter="url(#glow)"/>

  <!-- MacBook -->
  <g transform="translate(70 120)">
    <rect x="0" y="0" width="470" height="300" rx="18" fill="#0B0F16" stroke="#3A4560" stroke-width="3"/>
    <rect x="16" y="16" width="438" height="268" rx="6" fill="url(#screen)"/>
    <rect x="16" y="16" width="438" height="20" rx="6" fill="#000" opacity="0.28"/>
    <rect x="60" y="70" width="210" height="150" rx="10" fill="#FFFFFF" opacity="0.92"/>
    <rect x="60" y="70" width="210" height="24" rx="10" fill="#E8ECF4"/>
    <circle cx="78" cy="82" r="5" fill="#FF5F57"/><circle cx="94" cy="82" r="5" fill="#FEBC2E"/><circle cx="110" cy="82" r="5" fill="#28C840"/>
    <rect x="76" y="108" width="150" height="10" rx="5" fill="#C9D2E3"/>
    <rect x="76" y="128" width="170" height="10" rx="5" fill="#DDE3EE"/>
    <rect x="76" y="148" width="120" height="10" rx="5" fill="#DDE3EE"/>
    <rect x="300" y="130" width="120" height="110" rx="10" fill="#FFFFFF" opacity="0.25"/>
    <path d="M-30 300 H500 a14 14 0 0 1 -14 16 H-16 a14 14 0 0 1 -14 -16 z" fill="#4A5570"/>
    <rect x="195" y="300" width="80" height="6" rx="3" fill="#2E3648"/>
  </g>

  <!-- beam -->
  <rect x="560" y="246" width="110" height="8" rx="4" fill="url(#beam)"/>
  <rect x="575" y="270" width="80" height="5" rx="2.5" fill="url(#beam)" opacity="0.6"/>
  <rect x="575" y="225" width="80" height="5" rx="2.5" fill="url(#beam)" opacity="0.6"/>

  <!-- Tablet -->
  <g transform="translate(690 110)">
    <rect x="0" y="0" width="440" height="290" rx="26" fill="#0B0F16" stroke="#3A4560" stroke-width="3"/>
    <rect x="18" y="18" width="404" height="254" rx="10" fill="url(#screen2)"/>
    <rect x="18" y="18" width="404" height="18" rx="9" fill="#000" opacity="0.25"/>
    <rect x="40" y="56" width="230" height="170" rx="10" fill="#FFFFFF" opacity="0.94"/>
    <rect x="40" y="56" width="230" height="24" rx="10" fill="#E8ECF4"/>
    <circle cx="58" cy="68" r="5" fill="#FF5F57"/><circle cx="74" cy="68" r="5" fill="#FEBC2E"/><circle cx="90" cy="68" r="5" fill="#28C840"/>
    <rect x="58" y="96" width="194" height="80" rx="8" fill="#A9B2FF" opacity="0.35"/>
    <rect x="58" y="188" width="120" height="10" rx="5" fill="#DDE3EE"/>
    <rect x="290" y="56" width="110" height="80" rx="10" fill="#FFFFFF" opacity="0.25"/>
    <rect x="290" y="146" width="110" height="80" rx="10" fill="#FFFFFF" opacity="0.18"/>
    <!-- finger -->
    <circle cx="210" cy="140" r="16" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="210" cy="140" r="7" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <text x="600" y="470" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#FFFFFF">Your Mac, on more than one screen.</text>
</svg>
