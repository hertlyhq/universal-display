# Builds a release from the private source repo and publishes it here.
# Triggered only by hand (or scripts/release.sh in the source repo): never by pull requests, so the
# secrets below are only ever used by the owner. These logs are public: the build steps print no
# compiler output.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag of the private source repo (e.g. v1.0.0)
        required: true
      version:
        description: Version (e.g. 1.0.0)
        required: true

permissions:
  contents: write
  actions: read

concurrency: release

env:
  SOURCE_REPO: hertlyhq/universal-display-code

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          # The runner already has the Android SDK (ANDROID_HOME); Gradle fetches what's missing.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          cd src/android
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE" | base64 -d > keystore/release.jks
          printf '%s\n' "$ANDROID_KEYSTORE_PROPERTIES" > keystore.properties
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          printf 'versionCode=%s\nversionName=%s\n' "$CODE" "${{ inputs.version }}" > version.properties
          if ! ./gradlew --quiet assembleRelease > "$RUNNER_TEMP/gradle.log" 2>&1; then
            echo "Android build failed. Files with errors (details stay private; reproduce locally):"
            grep -E "^e: " "$RUNNER_TEMP/gradle.log" | sed -E 's|^e: .*/([^/:]+):[0-9]+:[0-9]+.*|  \1|' | sort | uniq -c || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/UniversalDisplay.apk"
          echo "$CODE" > "$GITHUB_WORKSPACE/out/UniversalDisplay.apk.version"
          rm -f keystore/release.jks keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/
          retention-days: 1

  # Runs alongside "android"; it only waits for the APK at the end, to put it inside the app.
  mac:
    runs-on: macos-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: src
          fetch-depth: 0 # history and tags, for the release notes
      - name: Signing keychain
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 7200 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$MAC_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          echo "certificate file: $(wc -c < "$RUNNER_TEMP/cert.p12") bytes"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          for ca in AppleWWDRCAG3 AppleWWDRCAG4 DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" && \
              security import "$RUNNER_TEMP/$ca.cer" -k "$KC" > /dev/null 2>&1 || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "signing identities:"
          security find-identity -p codesigning "$KC"
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Development: hello@hertly.com"
      - name: Tools
        run: |
          brew install --quiet xcodegen > /dev/null
          curl -fsSL https://dl.google.com/android/repository/platform-tools-latest-darwin.zip -o "$RUNNER_TEMP/pt.zip"
          unzip -q "$RUNNER_TEMP/pt.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/platform-tools" >> "$GITHUB_PATH"
      - name: Build Mac app
        run: src/scripts/ci-mac.sh build "${{ inputs.version }}" "$((1000 + GITHUB_RUN_NUMBER))"
      - name: Wait for the Android app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            gh run download "$GITHUB_RUN_ID" -R "${{ github.repository }}" -n apk -D src/build > /dev/null 2>&1 && break
            sleep 10
          done
          test -f src/build/UniversalDisplay.apk
      - name: Package
        run: src/scripts/ci-mac.sh package
      - name: Sign update and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ inputs.version }}"
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          ZIP=src/build/UniversalDisplay-mac.zip
          KEY="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY"
          SIG=$(src/mac/build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file "$KEY" "$ZIP")
          rm -f "$KEY"
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/UniversalDisplay-mac.zip"
          cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Universal Display</title>
              <item>
                <title>Version $VERSION</title>
                <pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <enclosure url="$URL" type="application/octet-stream" $SIG/>
              </item>
            </channel>
          </rss>
          XML
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version }}"
          # Notes from the Conventional Commits since the previous tag.
          src/scripts/release-notes.sh "${{ inputs.ref }}" > notes.md
          printf '\n---\nMac build %s · Android versionCode %s\n' "$((1000 + GITHUB_RUN_NUMBER))" \
            "$(cat src/build/UniversalDisplay.apk.version)" >> notes.md
          gh release create "v$VERSION" --repo "${{ github.repository }}" --title "Universal Display $VERSION" \
            --notes-file notes.md \
            src/build/UniversalDisplay-mac.zip src/build/UniversalDisplay.apk appcast.xml
